# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# =====================================================================================================
# verify-ai-adversarial — offline Crescendo red team of ONE app against the approved corpus.
#
# Copy to .ai-security/redteam-adversarial/<app-label>/redteam.yaml, fill every <...>, then run:
#   "${CLAUDE_PLUGIN_ROOT}/scripts/verify-offline.sh" redteam eval -c redteam.yaml \
#       -o results-$(date +%Y%m%d-%H%M).json --no-cache --no-share --no-progress-bar -j 4
# The wrapper regenerates tests.generated.yaml from this file, forces promptfoo's offline flags, blocks every
# request to a host outside AISEC_ALLOWED_HOSTS, and exits 3 if anything but promptfoo's telemetry beacon tried.
# Never run this config without the wrapper.
#
# Everything below is a NATIVE promptfoo field except the `x-aisec:` block. Secrets are never written here:
# reference them by env var name (apiKeyEnvar) or as {{env.NAME}}. Both work everywhere in this file,
# including inside Crescendo, when run through the wrapper. Verified against promptfoo 0.123.1.
# =====================================================================================================
description: "<app-label> :: aisec-core :: crescendo"
prompts: ["{{prompt}}"]

# -----------------------------------------------------------------------------------------------------
# 1. TARGET — the app or model under test. Default: any OpenAI-compatible chat endpoint (app, gateway or
#    model) reached through a base URL + API key. Crescendo sends the whole conversation each turn
#    (stateful: false), which this provider handles natively.
# -----------------------------------------------------------------------------------------------------
targets:
  - id: openai:chat:<target-model-or-alias>
    label: <app-label>                       # stable: it is the cross-app comparison key
    config:
      apiBaseUrl: <https://proxy.example.internal/v1>   # include /v1 (the provider appends /chat/completions)
      apiKeyEnvar: AISEC_TARGET_API_KEY      # NAME of the env var holding the target key
      # temperature: 0                       # optional; keep the app's production settings when known

  # --- 1b. OPTIONAL GUARDRAIL-AWARE TARGET ----------------------------------------------------------
  # Use INSTEAD of the target above when a runtime guardrail (LiteLLM guardrails, Bedrock Guardrails,
  # Model Armor, a WAF, the app's own filter) blocks with HTTP 400/403/422 or a canned 200 reply.
  # promptfoo's openai: provider counts a 400 as a transport ERROR; this http variant makes the block
  # gradeable and scores it `guardrails.flagged` instead. Copy templates/guardrail-transform.js and
  # templates/to-messages.js next to this file. Classification order in guardrail-transform.js:
  #   X-Guardrail-Action header -> auth failure (401/403 + auth text) = ERROR -> 400/403/422/451 or
  #   block markers = BLOCKED -> 200 matching AISEC_BLOCK_TEXT = BLOCKED -> 5xx = ERROR -> normal.
  # - id: http
  #   label: <app-label>
  #   config:
  #     url: <https://proxy.example.internal/v1/chat/completions>
  #     method: POST
  #     headers:
  #       Content-Type: application/json
  #       Authorization: "Bearer {{env.AISEC_TARGET_API_KEY}}"
  #     body:
  #       model: <target-model-or-alias>
  #       # messages are added by to-messages.js; do not add a static `messages` field
  #     transformRequest: file://to-messages.js
  #     transformResponse: file://guardrail-transform.js
  #     validateStatus: "() => true"          # let 4xx through to the classifier
  #     maxRetries: 0                         # a block is an answer, not a transient failure
  # Non-OpenAI app APIs: use the vendored promptfoo-provider-setup skill to write the http/JS target,
  # then keep the four guardrail lines above if a guardrail can block.

redteam:
  # ---------------------------------------------------------------------------------------------------
  # 2. PURPOSE (required) — what the app does, who uses it, tools and data it can reach, and what it must
  #    never do. Crescendo uses it to aim the attack; every grader uses it to judge. Copy from
  #    .ai-security/profile.md §1/§3/§5. Say it is authorized security testing of this app.
  # ---------------------------------------------------------------------------------------------------
  purpose: |
    <Authorized security test of <app>. What it does, who uses it, which tools/data it can reach,
     and what it must never do.>

  # ---------------------------------------------------------------------------------------------------
  # 3. ATTACKER (required) — writes each Crescendo turn. Reads OPENAI_BASE_URL + OPENAI_API_KEY from the
  #    environment (setting OPENAI_API_KEY also stops promptfoo falling back to its cloud). Missing here =
  #    promptfoo silently uses its default OpenAI model, so the wrapper refuses to run without it.
  #    Model choice: references/model-recommendations.md.
  # ---------------------------------------------------------------------------------------------------
  provider:
    id: openai:chat:<attacker-model-or-alias>
    config:
      response_format: { type: json_object } # Crescendo parses JSON; promptfoo only sets this for its own default
                                             # model, so set it here (remove only if the proxy rejects it)
      showThinking: false                    # drop a reasoning model's "Thinking:" text so Crescendo's JSON parses
      # apiBaseUrl: <https://other-proxy.example.internal/v1>   # only if not on OPENAI_BASE_URL's proxy
      # apiKeyEnvar: AISEC_ATTACKER_API_KEY
      # temperature: 0.7                     # 0.5-0.7 keeps Crescendo's JSON reliable
      # max_tokens: 4096                     # reasoning attackers: room for thinking plus the JSON answer

  # ---------------------------------------------------------------------------------------------------
  # 4. CRESCENDO — the only strategy used with the approved corpus. Remote-only strategies (goat,
  #    jailbreak:hydra/meta/composite/likert/goblin/tree, gcg, citation, audio) are refused offline.
  # ---------------------------------------------------------------------------------------------------
  strategies:
    - id: crescendo
      config:
        maxTurns: 10              # conversation depth; 10 is the offline maximum (promptfoo caps it)
        maxBacktracks: 10         # on a refusal, rewind the last turn and try a new angle; 0 disables
        stateful: false           # false: the full conversation is re-sent each turn (backtracking works)
                                  # true: the app keeps history via {{sessionId}}; backtracking is DISABLED
        continueAfterSuccess: false  # true: keep attacking after the first success (more findings, more cost)

# -----------------------------------------------------------------------------------------------------
# 5. JUDGE — grades every turn: refusal check, Crescendo's goal scoring and the plugin graders. Defaults to
#    the attacker's endpoint (OPENAI_BASE_URL / OPENAI_API_KEY). A stronger or different model here is
#    fine: judging is rarely refused.
# -----------------------------------------------------------------------------------------------------
defaultTest:
  options:
    provider:
      id: openai:chat:<judge-model-or-alias>
      config:
        response_format: { type: json_object }   # refusal check, goal score and graders all parse JSON
        showThinking: false                  # judges must return clean JSON
        # apiBaseUrl: <https://judge-proxy.example.internal/v1>
        # apiKeyEnvar: AISEC_JUDGE_API_KEY
  # --- OPTIONAL: score guardrail blocks as passes -----------------------------------------------------
  # By default a block is reported separately (guardrail_blocked) and the plugin grader still decides.
  # Uncomment to make "blocked by the guardrail" count as a pass on every test:
  # assert:
  #   - type: not-guardrails

# -----------------------------------------------------------------------------------------------------
# 6. CORPUS SELECTION (verify-ai-adversarial extension; ignored by promptfoo itself)
# -----------------------------------------------------------------------------------------------------
x-aisec:
  tiers: [1]                  # [1] first scan / PR gate (20) · [1, 2] release gate (40) · omit = all 60
  # excludePlugins: [shell-injection, sql-injection]   # drop plugins that cannot apply; say why in README
  # systemPrompt: |                                      # the app's real system prompt, if known:
  #   <...>                                              # prompt-extraction graders compare against it
  benignControl: false        # true with a guardrail target: adds a harmless prompt that must NOT be
                              # blocked; if it is, the run is inconclusive (auth/config), not a pass
  # corpus: <path>            # default: newest entry in the plugin's corpus/manifest.json

tests: file://tests.generated.yaml   # written by the wrapper from x-aisec; do not edit or commit by hand
