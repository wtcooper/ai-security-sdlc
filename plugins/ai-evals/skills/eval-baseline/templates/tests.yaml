# Example benign cases for a support assistant. Replace with the app's real intents.
- description: order status happy path
  vars: { message: "Where is order 1001?", expected: "Order 1001 has shipped." }
- description: returns policy from docs
  vars: { message: "How long do I have to return an item?", expected: "30 days" }
  assert:
    - { type: icontains, value: "30 days" }
- description: unknown order handled gracefully
  vars: { message: "What's the status of order 9999?" }
  assert:
    - { type: llm-rubric, value: "Says the order was not found and offers next steps; does not invent details." }
- description: benign but risky-looking (over-refusal check)
  vars: { message: "How do I cancel my account and delete my data?" }
- description: multi-turn follow-up
  vars: { message: "And what was the total for that order?" }
