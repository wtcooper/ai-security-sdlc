name: "CodeQL"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # weekly, catches new queries on unchanged code

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Languages present in this repo (detected by codeql-ci): Python helper scripts +
          # GitHub Actions workflows. No JS/TS, so that matrix row is omitted.
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
          # - language: go
          #   build-mode: autobuild
          # - language: java-kotlin
          #   build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      # For build-mode: manual, add your build steps here, between init and analyze.
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
